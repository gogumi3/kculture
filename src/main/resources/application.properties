spring.application.name=kculture

# MySQL ??
spring.datasource.url=jdbc:mysql://localhost:3306/kculture
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}

# Flyway? ??? ??? ??? ??
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA? ???? ???? ?? Entity? ????? ??
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Gemini (MV 분석) - 키는 환경변수로만 주입, 커밋 금지
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.min-confidence=${GEMINI_MIN_CONFIDENCE:0.5}
gemini.timeout-seconds=${GEMINI_TIMEOUT:120}

# YouTube Data API (곡 메타데이터 자동 수집)
youtube.api-key=${YOUTUBE_API_KEY:}

# JWT (운영 환경에서는 반드시 JWT_SECRET 환경변수로 충분히 긴 임의 값을 주입)
jwt.secret=${JWT_SECRET:local-development-secret-change-me-32-bytes}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
