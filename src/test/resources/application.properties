spring.datasource.url=jdbc:h2:mem:kculture;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=test-secret-that-is-at-least-32-bytes-long
jwt.expiration-seconds=3600
cors.allowed-origins=http://localhost:3000,http://localhost:5173
youtube.api-key=test-youtube-key
gemini.api-key=test-gemini-key
