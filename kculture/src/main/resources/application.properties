spring.application.name=kculture

# MySQL ??
spring.datasource.url=jdbc:mysql://localhost:3306/kculture
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:1234}

# Flyway? ??? ??? ??? ??
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA? ???? ???? ?? Entity? ????? ??
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===== [Claude 자동 추가] 외부 API / 업로드 설정 =====
# GitHub 푸시 보호(secret scanning)에 실제 키 값이 걸려서, 진짜 값은 커밋하지 않고
# 환경변수 또는 절대 커밋되지 않는 application-local.properties에서 읽어오도록 바꿨습니다.
# 실행 전 아래 방법 중 하나로 값을 넣어주세요:
#   1) kculture/src/main/resources/application-local.properties.example 을
#      같은 폴더에 application-local.properties 로 복사한 뒤 실제 키 값을 채워넣기 (.gitignore에 등록됨)
#   2) 또는 환경변수로 YOUTUBE_API_KEY / GEMINI_API_KEY / JWT_SECRET / DB_PASSWORD 설정
spring.config.import=optional:application-local.properties

# 유튜브 Data API v3 검색용 키 (SongAutoImportService에서 사용)
app.youtube.api-key=${YOUTUBE_API_KEY:}
# Gemini API 키 (GeminiVisionClient에서 유튜브 영상 분석에 사용)
app.gemini.api-key=${GEMINI_API_KEY:}
# [Claude 추가] gemini-2.5-flash가 신규 사용자에게 제공 중단(404)돼서 명시적으로 지정했습니다.
app.gemini.model=gemini-3.8-flash
# JWT_SECRET: 현재는 토큰 없는 MVP 로그인 방식이라 미사용. 나중에 실제 JWT 붙일 때 사용하세요.
app.jwt.secret=${JWT_SECRET:}

# 미션 인증 사진 업로드 저장 경로/용량 제한 (UploadController에서 사용)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
